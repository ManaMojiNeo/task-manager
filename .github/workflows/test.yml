name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: node --test tests/unit/*.test.mjs

      - name: Run integration tests
        run: node --test tests/integration/*.test.mjs

      - name: Run security tests
        run: node --test tests/security/*.test.mjs

      - name: Run e2e tests
        run: node --test tests/e2e/*.test.mjs
